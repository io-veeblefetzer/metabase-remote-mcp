name: CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B clean verify -DskipITs

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  # Integration tests job - runs only on main branch
  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: metabase
          POSTGRES_PASSWORD: metabase
          POSTGRES_DB: metabase
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      sample-db:
        image: postgres:15
        env:
          POSTGRES_USER: sample
          POSTGRES_PASSWORD: sample
          POSTGRES_DB: sample_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Metabase
        run: |
          docker run -d --name metabase \
            -p 3000:3000 \
            -e MB_DB_TYPE=postgres \
            -e MB_DB_DBNAME=metabase \
            -e MB_DB_PORT=5432 \
            -e MB_DB_USER=metabase \
            -e MB_DB_PASS=metabase \
            -e MB_DB_HOST=postgres \
            --network host \
            metabase/metabase:latest
          
          # Wait for Metabase to be ready (up to 5 minutes)
          echo "Waiting for Metabase to start..."
          for i in {1..60}; do
            if curl -s http://localhost:3000/api/health | grep -q "ok"; then
              echo "Metabase is ready!"
              break
            fi
            echo "Waiting... ($i/60)"
            sleep 5
          done

      - name: Run integration tests
        run: mvn -B verify -Dspring.profiles.active=integration
        continue-on-error: true  # Integration tests may fail if Metabase isn't fully configured

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: target/failsafe-reports/

      - name: Stop Metabase
        if: always()
        run: docker stop metabase || true
