# Integration test profile - uses real Metabase
spring.main.banner-mode=off
logging.level.root=INFO
logging.level.io.veeblefetzer=DEBUG

# Metabase configuration - uses preconfigured API key from docker-compose
metabase.url=${METABASE_URL:http://localhost:3000}
metabase.api-key=${METABASE_API_KEY:THIS_IS_A_VERY_SECRET_API_KEY}
metabase.connect-timeout=10s
metabase.read-timeout=30s
metabase.max-connections=10

# MCP Server Configuration for tests
spring.ai.mcp.server.name=metabase-mcp-server-test
spring.ai.mcp.server.version=1.0.0
