spring.application.name=remote-mcp-server

# ===================================================================
# MCP Server Configuration
# ===================================================================
# Server name for MCP protocol
spring.ai.mcp.server.name=metabase-mcp-server
spring.ai.mcp.server.version=1.0.0

# Enable SSE transport (default for MCP)
spring.ai.mcp.server.sse-message-endpoint=/mcp/message
spring.ai.mcp.server.stdio=false

# ===================================================================
# Metabase Configuration
# ===================================================================
# Base URL of the Metabase instance
metabase.url=${METABASE_URL:http://localhost:3000}

# API key for authentication with Metabase
# IMPORTANT: Set this via environment variable in production
metabase.api-key=${METABASE_API_KEY:your-api-key-here}

# Connection timeout for HTTP requests (default: 10s)
metabase.connect-timeout=10s

# Read timeout for HTTP requests (default: 30s)
metabase.read-timeout=30s

# Maximum number of connections in the pool (default: 10)
metabase.max-connections=10

# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.io.veeblefetzer=INFO
logging.level.io.veeblefetzer.remote_mcp_server.config=DEBUG

# ===================================================================
# Actuator Configuration
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
